name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a deployar (ex: v1.0.0). Deixe vazio para HEAD de main.'
        required: false
        default: ''
      confirm:
        description: 'Digite "DEPLOY" para confirmar'
        required: true
        default: ''

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  validate:
    name: Validar confirmação
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm != 'DEPLOY'
    steps:
      - run: |
          echo "::error::Confirmação inválida. Use 'DEPLOY' para confirmar."
          exit 1

  deploy:
    name: Deploy to production
    if: github.event.inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cofrito.web.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || 'main' }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Validar versão
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            git fetch --tags
            if ! git rev-parse "${{ github.event.inputs.tag }}" >/dev/null 2>&1; then
              echo "::error::Tag ${{ github.event.inputs.tag }} não existe"
              exit 1
            fi
            git checkout "${{ github.event.inputs.tag }}"
          fi

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Selecionar projeto de produção
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx -p firebase-tools firebase use cofrito --token "$FIREBASE_TOKEN"

      # Backup desabilitado (hosting:clone exige --source/--target, simplificacao)
      # - name: Backup antes do deploy
      #   env:
      #     FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      #   run: |
      #     npx -p firebase-tools firebase hosting:clone --non-interactive --token "$FIREBASE_TOKEN" \
      #       --project cofrito \
      #       live:pre-deploy-$(date +%Y%m%d-%H%M%S)

      - name: Limpar functions legadas (3 problematicas)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx -p firebase-tools firebase functions:delete --region southamerica-east1 --non-interactive --token "$FIREBASE_TOKEN" --force \
            getProfile getLLMConfig getPublicResearchStatus || echo "(algumas functions podem nao existir, ok)"

      - name: Deploy
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx -p firebase-tools firebase deploy --non-interactive --token "$FIREBASE_TOKEN"

      - name: Smoke test
        run: |
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://cofrito.web.app/)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Smoke test falhou: $STATUS"
            exit 1
          fi
          echo "✓ Smoke test passou"

      - name: Notificar Slack
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "🚨 Deploy produção: ${{ job.status }}",
              "attachments": [
                {
                  "color": "${{ job.status == 'success' && 'good' || 'danger' }}",
                  "fields": [
                    { "title": "Tag/Commit", "value": "${{ github.event.inputs.tag || github.sha }}", "short": true },
                    { "title": "Autor", "value": "${{ github.actor }}", "short": true }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
